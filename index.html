<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AP Lang Lessons</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--paper:#fff;--ink:#17130f;--ink2:#57504a;--line:#e3ded9;--orange:#b54708}
@media (prefers-color-scheme:dark){:root{--paper:#141210;--ink:#f3efea;--ink2:#b9b0a7;--line:#36312c;--orange:#ff9a52;color-scheme:dark}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,sans-serif;line-height:1.6}
main{max-width:40rem;margin:0 auto;padding:3rem 20px}
h1{font-family:Archivo,Arial,sans-serif;font-weight:850;font-stretch:112%;font-size:2.4rem;margin:.3rem 0 1.5rem;padding-bottom:1rem;border-bottom:3px solid var(--ink)}
.eyebrow{font-family:Archivo,Arial,sans-serif;font-weight:700;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
ul{list-style:none;padding:0;margin:0}
li a{display:block;padding:1rem 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
li a b{font-family:Archivo,Arial,sans-serif;font-size:1.2rem}
li a span{display:block;color:var(--ink2)}
li a:hover b{color:var(--orange)}
</style>
</head>
<body>
<main>
<span class="eyebrow">Mr. Provini &middot; Northampton Area High School</span>
<h1>AP Lang Lessons</h1>
<ul>
<li><a href="claim-to-thesis/"><b>From Claim to Thesis</b><span>Closed, open, and counterargument thesis statements, plus relevant, accurate, and sufficient evidence.</span></a></li>
</ul>
</main>
</body>
</html>
